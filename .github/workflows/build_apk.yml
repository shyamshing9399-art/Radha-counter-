name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Save our custom code temporarily
        run: |
          mkdir -p temp_lib
          cp lib/main.dart temp_lib/main.dart
          cp pubspec.yaml temp_lib/pubspec.yaml

      - name: Create Fresh Flutter Project
        run: |
          flutter create . --org com.namjap.counter --project-name nam_jap_counter --platforms=android --overwrite

      - name: Restore our custom code and dependencies
        run: |
          cp temp_lib/main.dart lib/main.dart
          cp temp_lib/pubspec.yaml pubspec.yaml
          flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
